# =============================================================================
# ReSETP 中控台 — 运行选择（用户可改）
# =============================================================================
# 用法：
#   1. 改本文件「选什么」
#   2. 改 PARAMETERS_CONSOLE.yaml「怎么跑 / 路径 / 图风格」
#   3. VS Code 打开 CONTROL_CONSOLE.py → 运行 / F5
# =============================================================================

schema_version: "resetp-control-console.v1"

# 运行模式（三选一）:
#   batch  — 跑下面 batch.jobs 列表（可多实验多图）
#   select — 只跑 select.experiments + select.artifacts
#   range  — 按 range 起止闭区间（实验/图表 ID 字典序）
mode: select

# 安全开关：true = 只规划与自检，不调用重型求解器（首次建议 true）
dry_run: true

# 失败策略：continue | halt
on_error: halt

# -----------------------------------------------------------------------------
# mode = select：点名运行
# -----------------------------------------------------------------------------
select:
  experiments:
    - E2
  # 产物：表 T* / 图 F* / 特殊 ALL
  artifacts:
    - T3
    - F2
  # 可选：算例过滤（空 = 用 PARAMETERS 里的正式默认）
  instances: []

# -----------------------------------------------------------------------------
# mode = batch：批量任务列表
# -----------------------------------------------------------------------------
batch:
  jobs:
    - id: e2_main_compare
      experiment: E2
      artifacts: [T3, F2]
      instances: []
    # - id: paper_refresh_figs
    #   experiment: PAPER
    #   artifacts: [F1, F2, F3, F4, F5, F6]
    #   instances: []

# -----------------------------------------------------------------------------
# mode = range：范围运行（实验 ID 与产物 ID 各自闭区间）
# 实验顺序：E1 E2 E3 E4 E5 E6 E7 PAPER
# 产物顺序：T1 T3 T4 T5 T6 T7 T8 T9 F1 F2 F3 F4 F5 F5b F6 F7
# -----------------------------------------------------------------------------
range:
  experiment_from: E1
  experiment_to: E3
  artifact_from: T3
  artifact_to: F2
  instances: []

# -----------------------------------------------------------------------------
# 可选 CLI 覆盖（一般不用；命令行 --mode/--dry-run 优先）
# -----------------------------------------------------------------------------
notes: |
  正式算例默认见 PARAMETERS_CONSOLE.yaml → instances.formal_set = L-main-threeshift-9。
  E2 性能冲刺（约超第二名 5%）已挂帐，不在本中控台默认重跑。
